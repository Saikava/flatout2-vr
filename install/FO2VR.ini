; FO2VR. Log: FO2VR.log next to this file, screenshots: shots\

[VR]
Enabled=1           ; 1 = show the game in the headset (OpenXR). Needs DXVK's 32-bit d3d9.dll in the game folder
                    ;     and the headset connected at game start.
; OpenXR runtime: steamvr (start SteamVR first), default (the system's active runtime) or the path of a runtime .json.
; Meta's own 32-bit OpenXR runtime (v208) crashes when a 32-bit game starts a session, so Quest + Link goes through SteamVR.
Runtime=steamvr
RenderScale=1.0     ; eye resolution relative to the headset's recommended size
MSAA=4              ; antialiasing samples for the eye images (0 = off)
WorldScale=1.0      ; head movement scale (1 = 1 m of head movement is 1 m in the game)
ScreenDistance=2.0  ; menus: distance of the flat screen, meters
ScreenWidth=2.4     ; menus: width of the flat screen, meters
Mirror=1            ; races: 1 = the monitor shows the left eye (saves rendering the scene a third time), 0 = its own view
; Races: 1 = every headset frame simulates one physics step as long as the headset's frame (smooth
; motion at 72/90/120 Hz), 0 = the game's own 10 ms steps (at most 100 frames a second, uneven motion).
PhysicsAtHeadsetRate=1
; Races: the game's HUD (position, laps, speedometer, map, pause menu) on a panel in the headset.
Hud=1               ; 0 = no HUD in the headset (the monitor still shows it)
HudDistance=1.2     ; meters in front of you
HudWidth=1.3        ; meters (the height follows the screen's aspect ratio)
HudHeight=0.0       ; meters above (negative: below) eye level
LodDistance=0       ; level of detail: 0 = no limit, everything at full detail as far as the track's fog.
                    ;     Otherwise the distances at which objects get simpler models (a car's wheels, trees,
                    ;     bushes), fade out or are left out as too small, times this (1 = as on a monitor)
GrassDistance=5.0   ; how far ahead grass is drawn (it fades out at 50-80 m on a monitor), times this
ViewDistance=3.0    ; how far the world is drawn at all (the track's visibility, some 500-1000 m on a monitor), times this

[Test]
AutoShotSeconds=0   ; >0: screenshot every N seconds while racing
VrEyesWithoutHeadset=0  ; 1 = render the eyes even when the headset is asleep (for checking screenshots without wearing it)
PaceHz=0            ; races: pace the game like a headset at this rate instead of the real one (0 = off)
PaceJitter=0        ; 1 = the pretend headset's display times wander and jump a frame now and then, like SteamVR's
StepProbe=0         ; 1 = log how evenly the player's car moves from frame to frame
HeadOffset=0 0 0        ; meters added to the eye positions (x right, y up, z forward), for tests
Sampling=0          ; 1 = profiler: see where the game thread spends slow frames (logged as "slow frame")
ShareEyes=1         ; 1 = the right eye copies the cards the left eye built for the trees' leaves and the grass (0 = each its own)
DeviceTiming=0      ; 1 = profiler: time every draw call and buffer lock (the slow frames' logs list them; costs
                    ;     some 0.1 ms per thousand draws)
Record=0            ; 1 = record the input from the game's start to the end of the next race to scripts\fo2vr_rec.bin
Replay=0            ; 1 = play scripts\fo2vr_rec.bin back: menus and race (best with Background=1, PaceHz=120, VrEyesWithoutHeadset=1)
FrameTimes=0        ; 1 = write each race frame's display time and start to scripts\fo2vr_frametimes.csv
ReplayStop=0        ; replay: after this many race frames log the benchmark totals and close the game (0 = whole race)
ReplayShots=        ; replay: screenshots at these race frames, e.g. "600 1200" (background mode)
ReplayTrace=0       ; replay: log one frame of render calls (with the draws of the left eye) at this race frame
Background=0        ; 1 = for tests beside other work: a window on another monitor instead of the full screen, no sound,
                    ;     keeps running without the focus; keys come from scripts\fo2vr_input.txt, not the keyboard

[Log]
IntervalSeconds=2

