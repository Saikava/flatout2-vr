; FO2VR. Log: FO2VR.log next to this file, screenshots: shots\

[VR]
Enabled=1           ; 1 = show the game in the headset (OpenXR). Needs DXVK's 32-bit d3d9.dll in the game folder
                    ;     and the headset connected at game start.
; OpenXR runtime: steamvr (start SteamVR first), default (the system's active runtime) or the path of a runtime .json.
; Meta's own 32-bit OpenXR runtime (v208) crashes when a 32-bit game starts a session, so Quest + Link goes through SteamVR.
; Virtual Desktop has its own 32-bit runtime (VDXR, no SteamVR): connect the headset in Virtual Desktop first, then
; Runtime=C:\Program Files\Virtual Desktop Streamer\OpenXR\virtualdesktop-openxr-32.json
Runtime=steamvr
RenderScale=1.0     ; eye resolution relative to the headset's recommended size
MSAA=4              ; antialiasing samples for the eye images (0 = off)
WorldScale=1.0      ; head movement scale (1 = 1 m of head movement is 1 m in the game)
ScreenDistance=2.0  ; menus: distance of the flat screen, meters
ScreenWidth=2.4     ; menus: width of the flat screen, meters
Mirror=1            ; races: 1 = the monitor shows the left eye (saves rendering the scene a third time), 0 = its own view,
                    ;     2 = the left eye for recording a video: a steady view (it follows the head smoothly, level
                    ;     with the car) and the HUD where it hangs in the headset
MonitorFov=85       ; Mirror=2: the view's width, degrees (the eyes are rendered wider for it than the headset needs:
                    ;     some 20% more pixels at 85 and 10 down, 30% at 90)
MonitorPitch=10     ; Mirror=2: the view aimed down by this, degrees (the dashboard and the hands on the wheel in view)
MonitorSmoothing=0.3 ; Mirror=2: how long the view takes to follow the head, seconds (0 = with it, as the eye)
; Races: 1 = every headset frame simulates one physics step as long as the headset's frame (smooth
; motion at 72/90/120 Hz), 0 = the game's own 10 ms steps (at most 100 frames a second, uneven motion).
PhysicsAtHeadsetRate=1
; Races: the game's HUD (position, laps, speedometer, map, pause menu) on a panel in the headset.
Hud=1               ; 0 = no HUD in the headset (the monitor still shows it), 2 = not while racing: only the
                    ;     countdown, the pause menu and the results (the Hud key switches between 1 and 2 and
                    ;     writes it here, for the next game)
HudDistance=1.2     ; meters in front of you
HudWidth=1.3        ; meters (the height follows the screen's aspect ratio)
HudHeight=0.0       ; meters above (negative: below) eye level
LodDistance=0       ; level of detail: 0 = no limit, everything at full detail as far as the track's fog.
                    ;     Otherwise the distances at which objects get simpler models (a car's wheels, trees,
                    ;     bushes), fade out or are left out as too small, times this (1 = as on a monitor)
GrassDistance=5.0   ; how far ahead grass is drawn (it fades out at 50-80 m on a monitor), times this
ViewDistance=3.0    ; how far the world is drawn at all (the track's visibility, some 500-1000 m on a monitor), times this
FloatDepth=1        ; the eyes keep depth as 32-bit floats, reversed: what lies close together far away (a turn
                    ;     sign's arrow on its board) stays apart instead of showing through it in crawling bands.
                    ;     0 = 24-bit depth as the game keeps it
SpeedBlur=1         ; races: the game's speed blur (at speed the picture smears outwards from the direction ahead), 0 = off
SpeedZoom=1.0       ; races: at speed the game widens its field of view and the world shrinks into the distance:
                    ;     1 = as much as on a monitor, 0.5 = half as much, 0 = off
; Races: the eyes moved against the car, meters (x right, y up, z forward): in the cockpit from the driver's
; eyes, otherwise from the game's camera. The camera keys ([Keys], the numeric keypad) move them in a race and
; write it here.
CameraOffset=0 0 0
; Races: the camera inside the car (the game's in-car view) becomes a cockpit: the eyes in the driver's head, and
; the driver at the wheel and the steering wheel shown (the game leaves them out there).
Cockpit=1           ; 0 = as the game shows it
StartInCockpit=1    ; 1 = the next start puts the game's race camera inside the car, once (the mod then sets this
                    ;     to 0; the camera you choose with C the game keeps)
CockpitHud=1        ; the cockpit: the gauges, position, lap, map and the rival's name on the dashboard, on one
                    ;     band curved round the eyes, laid out the same in every car (the gauges in the wheel, the
                    ;     position left of it, the lap and the rival right of it, the map below); the HUD panel keeps
                    ;     the messages, the countdown and the pause menu. 0 = all on the panel
NearClip=0.05       ; the cockpit: the nearest the near clipping plane comes, meters (it is kept as far out as the
                    ;     roof and the sides let it be, for depth precision far away; the game's camera: 0.3)
CockpitGlass=0.3    ; the cockpit: how much the car's windows show, 0 to 1: their reflections, the sun's glints on
                    ;     them and their tint. 0 = no glass, 1 = as strong as the game's own (seen from inside, its
                    ;     windscreen is just a picture darkened by half and its side windows a bright haze). The sun's
                    ;     flare and the dust beyond show through; broken glass is the game's
EjectView=1         ; the driver thrown out of the car (a heavy crash, the stunts' launch): from the cockpit the eyes
                    ;     stay in his head as he flies, without tumbling with it (level, turning with your head only),
                    ;     until the car is reset. 2 = also from the cameras outside the car (the stunts' cars have no
                    ;     camera inside), 0 = the game's cut to its camera behind him
Mirrors=2           ; the cockpit: the side mirrors show what is behind, set for your eyes, on their glass (until a
                    ;     mirror is knocked off). 1 = one picture for both eyes, flat on the glass (each mirror in view
                    ;     is one more, small render of the scene, some 0.3-0.5 ms), 2 = a picture for each eye (what the
                    ;     mirror shows has depth, as in a real one; twice the cost), 0 = the game's dark glass
MirrorRadius=1.4    ; the mirrors' glass is convex, as real side mirrors are, of this radius (metres): they show
                    ;     more of what is behind, smaller (objects in them are closer than they appear): the near
                    ;     one some two and a half times as wide a view as flat glass, the far one five or so.
                    ;     Larger = flatter; 0 = flat glass
LargeAddressAware=1 ; FlatOut2.exe may use 4 GB of memory, not 2: with 2 GB, larger tracks can run out of it in VR
                    ;     and the game stands still while one loads. The mod sets the flag in FlatOut2.exe when the
                    ;     game starts (the original kept as FlatOut2.exe.2GB.bak) and starts it anew. 0 = leave it
MotionControllers=1 ; the VR controllers (Touch and the like) as a game controller, "VR controllers": choose it in the
                    ;     game's Options > Controller options > Controller (the VR controllers work the menus: see
                    ;     the README). The left thumbstick steers, the right trigger accelerates and the left one
                    ;     brakes, A nitro, B handbrake, X camera, Y reset, the menu button pauses, the grips shift
                    ;     (manual), the right thumbstick pressed looks back; both thumbsticks pressed recenter the
                    ;     view. The game's Configure controls changes them. 0 = none
PauseButton=        ; a button of the VR controllers that pauses a race (and continues it) besides the menu button,
                    ;     which is on the left controller: RightStick (the right thumbstick pressed), RightGrip,
                    ;     LeftStick, LeftGrip, X or Y. The game then no longer sees that button: move what its
                    ;     Configure controls had on it to another (the right thumbstick pressed: Look back; the left
                    ;     thumbstick pressed is free). Empty = only the menu button
Rumble=1            ; the game's force feedback (its Options: Force feedback on) as vibration: of the VR controllers
                    ;     and of Xbox controllers (the game cannot make those vibrate itself), this strong (up to 2;
                    ;     0 = none)
EngineRumble=0      ; the engine as a light, steady vibration of the VR controllers (an Xbox controller's light motor)
                    ;     while driving, stronger with the revs and the throttle, at most this strong at the rev limit
                    ;     with the throttle down (with Force feedback on in the game's options; 0.2-0.5: a hum under the
                    ;     crashes' vibration). 0 = none
GrabWheel=0         ; experimental: 1 = squeeze a grip with your hand at the cockpit's steering wheel to take hold of
                    ;     it, and turn it with your hands (one or both); let go and it comes back to the middle (and
                    ;     the thumbstick steers again). The grips then hold the wheel, not shift
WheelTurn=90        ; GrabWheel: how far your hands turn the wheel for full lock, degrees. At 90 the cockpit's wheel
                    ;     turns with your hands (on the move the game turns the car, and its wheel, less); more =
                    ;     slower steering

[Test]
AutoShotSeconds=0   ; >0: screenshot every N seconds while racing
VrEyesWithoutHeadset=0  ; 1 = render the eyes even when the headset is asleep (for checking screenshots without wearing it)
PaceHz=0            ; races: pace the game like a headset at this rate instead of the real one (0 = off)
FakeHeadset=0       ; 1 = no headset: races render the eyes straight ahead, for screenshots (with PaceHz, VrEyesWithoutHeadset)
MoveCards=0         ; 1 = the Touch controllers move the cockpit's cards (to work out a layout): point at one, hold the
                    ;     trigger and carry it over the band (thumbstick up/down: the band further/nearer, left/right:
                    ;     the card smaller/larger); kept for that car in scripts\FO2VR_cards.ini. B or Y on a card: back
                    ;     to the layout
PaceJitter=0        ; 1 = the pretend headset's display times wander and jump a frame now and then, like SteamVR's
StepProbe=0         ; 1 = log how evenly the player's car moves from frame to frame
HeadOffset=0 0 0        ; meters added to the eye positions (x right, y up, z forward), for tests
Sampling=0          ; 1 = profiler: see where the game thread spends slow frames (logged as "slow frame")
ShareEyes=1         ; 1 = the right eye copies the cards the left eye built for the trees' leaves and the grass (0 = each its own)
DeviceTiming=0      ; 1 = profiler: time every draw call and buffer lock (the slow frames' logs list them; costs
                    ;     some 0.1 ms per thousand draws)
Record=0            ; 1 = record the input from the game's start to the end of the next race to scripts\fo2vr_rec.bin
Replay=0            ; 1 = play scripts\fo2vr_rec.bin back: menus and race (best with Background=1, PaceHz=120, VrEyesWithoutHeadset=1)
FrameTimes=0        ; 1 = write each race frame's display time and start to scripts\fo2vr_frametimes.csv
ControllersLog=0    ; 1 = log the VR controllers as the game reads them, the keys they press in the menus, the force-feedback effects and the vibration
ReplayStop=0        ; replay: after this many race frames log the benchmark totals and close the game (0 = whole race)
ReplayShots=        ; replay: screenshots at these race frames, e.g. "600 1200" (background mode)
ReplayTrace=0       ; replay: log one frame of render calls (with the draws of the left eye) at this race frame
Background=0        ; 1 = for tests beside other work: a window on another monitor instead of the full screen, no sound,
                    ;     keeps running without the focus; keys come from scripts\fo2vr_input.txt, not the keyboard

[Log]
IntervalSeconds=2

[Keys]
; Windows virtual key codes: 119 = F8, 120 = F9, 122 = F11
Recenter=119
Screenshot=122
Hud=120             ; the HUD in the headset: always or not while racing ([VR] Hud 1 / 2)
; The camera against the car ([VR] CameraOffset) in a race, while held, slowly at first: the numeric keypad
; with Num Lock on, 8 2 4 6 = up, down, left, right, + - = forward, back, 5 = back to 0 0 0
CameraUp=104
CameraDown=98
CameraLeft=100
CameraRight=102
CameraForward=107
CameraBack=109
CameraReset=101
